name: Skill snapshots and implementation units
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fixed public schema validator
        run: python3 -m pip install jsonschema==4.25.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Immutable public protocol authority
        uses: actions/checkout@v4
        with:
          repository: full-aigc-plugins/artcraft-plugin
          ref: 09d4ac5b8ff82f8fe819189e4be487b45ab2472b
          path: .contract-authority
          fetch-depth: 0
      - name: Required source gates and actual protocol mappings
        run: python3 -I -B scripts/check_release.py --authority .contract-authority --node node --output "${RUNNER_TEMP}/filmcraft-plugin-checks"
      - name: Preserve layered results and original logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-plugin-source
          path: ${{ runner.temp }}/filmcraft-plugin-checks
          if-no-files-found: error
